name: Deploy to VPS

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 'latest'

        - name: Create .env file
          run: echo "${{ secrets.ENV_FILE }}" > .env

        - name: Install dependencies
          run: npm install

        - name: Build the project
          run: npm run build

        - name: Deploy to VPS
          env:
            SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
            VPS_HOST: ${{ secrets.VPS_HOST }}
            VPS_USER: ${{ secrets.VPS_USER }}
          run: |
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/id_rsa

            ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

            ssh $VPS_USER@$VPS_HOST -o StrictHostKeyChecking=no "mkdir -p /var/www/cgfrontend"
            scp -o StrictHostKeyChecking=no -r ./dist/* $VPS_USER@$VPS_HOST:/var/www/cgfrontend/
            ssh $VPS_USER@$VPS_HOST -o StrictHostKeyChecking=no "cd /var/www/cgfrontend"